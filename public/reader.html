<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read a Chart</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#a2476b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#f4f5f9;--surface:#fff;--fg:#1c2133;--muted:#586079;--line:#d6dae6;--accent:#a2476b;--on-accent:#fff;--soft:#f6e6ee;--bad:#b3261e;--ok:#1f7a4d;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--surface:#1d2030;--fg:#eceef6;--muted:#a3abc4;--line:#343954;--accent:#e08aae;--on-accent:#1a1020;--soft:#35202b;--bad:#ff8a80;--ok:#6fd49c;--warn:#f2c26b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK JP",sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:920px;margin:0 auto;display:grid;gap:16px}
h1{font:700 30px "Space Grotesk",Inter,sans-serif;margin:0;text-wrap:balance}
h2{font:700 20px "Space Grotesk",Inter,sans-serif;margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.muted{color:var(--muted)} a{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--soft)}
.drop b{font-size:19px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px 20px;font:600 16px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.steps span{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps span.done{background:var(--soft);color:var(--fg)}
.stage{position:relative;line-height:0;touch-action:none;overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.stage canvas{max-width:100%;height:auto;display:block}
.stage.pulse{box-shadow:0 0 0 3px var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.msg{padding:14px 16px;border-radius:12px;background:var(--soft)}
.msg.bad{border:1px solid var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.big{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big canvas{width:112px;height:112px;border:2px solid var(--line);border-radius:14px;background:#fff;image-rendering:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;min-height:48px}
.tile:hover{border-color:var(--accent);background:var(--soft)}
.tile small{display:block;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;cursor:pointer}
.dots button.on{border-color:var(--accent)} .dots button.set{background:var(--accent);border-color:var(--accent)}
table{border-collapse:collapse;font-size:13px} td{border-bottom:1px solid var(--line);padding:3px 8px}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="h1"></h1>
 <div class="row"><a class="btn sec" id="back" href="/" style="padding:6px 12px;font-size:14px"></a><div class="seg" id="lang"></div></div></div>
<div class="steps" id="steps" aria-label="progress"></div>

<div class="card" id="upCard">
  <p id="intro" style="margin:0 0 14px;font-size:17px"></p>
  <label class="drop" id="drop" for="file"><b id="dropT"></b><br><span class="muted" id="dropS"></span></label>
  <input id="file" type="file" accept="image/*" hidden>
  <p class="muted" style="margin:12px 0 0;font-size:14px"><span id="privacy"></span> <a href="/" id="exLink"></a></p>
</div>

<div id="out" hidden>
 <div class="cols">
  <div class="card">
    <div class="stage" id="stage"><canvas id="cv"></canvas><canvas id="ov" style="position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair"></canvas></div>
    <p class="muted" id="cropHint" style="margin:8px 0 0;font-size:14px"></p>
    <div class="row" style="margin-top:8px"><label class="btn sec" for="file" id="another"></label><button class="btn sec" id="reset" hidden></button></div>
  </div>
  <div style="display:grid;gap:16px;align-content:start" id="side"></div>
 </div>
</div>
</main>
<script src="/reader.js"></script>
<script>
(function(){
var LANGS=[['en','EN'],['ru','RU']];
var T={
en:{h1:'Let\'s read your chart',intro:'Drop in a photo or screenshot of a knitting chart. I\'ll find the grid, and you only answer a few easy questions about the symbols. No knitting knowledge needed to start.',
 dropT:'Tap to choose a photo, or drop it here',dropS:'You can also paste an image',privacy:'Your picture stays on your device and is never uploaded.',exLink:'Or try a ready-made example first →',
 back:'← Examples',s1:'1 Picture',s2:'2 Symbols',s3:'3 Ready',
 crop:'Tip: draw a box around one chart to look at just that part.',reset:'Use the whole picture',
 cropHelp:'Draw a box around ONE chart on the picture. Use a finger or the mouse; the box can be small.',
 tooSmall:'This picture is too small for me to see the symbols. A bigger photo or screenshot will work.',
 lowContrast:'It\'s hard to tell the lines from the paper. Try a photo in even daylight, without shadows, or a scan.',
 blurry:'It\'s a bit blurry, or the chart is tiny in the picture. Draw a box around the chart, or take a closer photo.',
 noGrid:'I can\'t see a chart in this picture yet. If it\'s only a small part of a page, draw a box around it. If it isn\'t a knitting chart, try another picture.',
 irregular:'I see lines, but they don\'t form an even grid. Maybe the page is curved or tilted. A flat photo taken straight from above works best.',
 noSymbols:'I found a grid but nearly all cells are empty. Is the picture too faint, or is this a blank template?',
 photo:'This looks like a picture of something else, not a chart. Draw a box around the chart, or choose another picture.',
 warnBlur:'The picture is a bit soft, so double-check my guesses.',
 found:'I found your chart: {rows} rounds and {cells} squares.',
 meet:'Meet your stitches',of:'Symbol {i} of {n}',appears:'appears {n} times (shown on the chart)',
 q:'What does this symbol mean?',looks:'It looks like: {x}. Right?',yes:'Yes, that\'s it',no:'No, pick another',idk:'I\'m not sure',idkS:'I\'ll mark it and we\'ll check later',
 back1:'Back',next:'Next',another:'Choose another picture',
 doneT:'Chart unlocked!',almost:'Almost there',doneOk:'All {n} rounds add up. Your chart makes sense, and I can explain every stitch.',
 doneBad:'Round {r} doesn\'t add up: it uses {a} stitches but the round below makes {b}. One symbol may have the wrong answer. Go back and check.',
 doneUnk:'{n} symbol(s) are marked "not sure". I can\'t explain those yet.',
 start:'Start learning →',review:'Check my answers',tbl:'Show per-round counts',chkPer:'Round {r}: uses {a}, makes {b}',
 L:{knit:['knit','the most common stitch'],purl:['purl','a little bump on the front'],yo:['yarn over','a deliberate hole'],k2tog:['knit 2 together','two stitches become one'],skp:['slip, knit, pass over','two become one, leaning left'],inc3:['one into three','one stitch grows into three'],blank:['empty square','means knit on the front'],nostitch:['no stitch','a filler, skip it'],unknown:['I\'m not sure',''],cable:['cable or crossing','I can\'t explain these yet']}},
ru:{h1:'Давайте прочитаем вашу схему',intro:'Загрузите фото или скриншот схемы вязания. Я найду сетку, а вам нужно будет ответить на несколько простых вопросов о символах. Знать вязание для старта не нужно.',
 dropT:'Нажмите, чтобы выбрать фото, или перетащите его сюда',dropS:'Можно и вставить картинку',privacy:'Картинка остаётся на вашем устройстве и никуда не загружается.',exLink:'Или сначала посмотрите готовый пример →',
 back:'← Примеры',s1:'1 Картинка',s2:'2 Символы',s3:'3 Готово',
 crop:'Совет: обведите рамкой одну схему, чтобы смотреть только её.',reset:'Вся картинка',
 cropHelp:'Обведите рамкой ОДНУ схему на картинке. Пальцем или мышью; рамка может быть небольшой.',
 tooSmall:'Картинка слишком маленькая, символов не разглядеть. Подойдёт фото или скриншот побольше.',
 lowContrast:'Линии плохо видно на фоне бумаги. Попробуйте фото при дневном свете без теней или скан.',
 blurry:'Немного размыто, или схема крошечная на снимке. Обведите её рамкой или снимите ближе.',
 noGrid:'Пока не вижу здесь схему. Если она занимает лишь часть страницы, обведите её рамкой. Если это не схема вязания, попробуйте другую картинку.',
 irregular:'Линии вижу, но ровной сетки они не дают. Возможно, страница изогнута или наклонена. Лучше всего плоское фото строго сверху.',
 noSymbols:'Сетка есть, но почти все клетки пустые. Картинка слишком бледная или это пустой шаблон?',
 photo:'Похоже, это фотография чего-то другого, а не схема. Обведите схему рамкой или выберите другую картинку.',
 warnBlur:'Снимок немного мягкий, поэтому проверьте мои догадки.',
 found:'Схема найдена: кругов {rows}, клеток {cells}.',
 meet:'Знакомство с петлями',of:'Символ {i} из {n}',appears:'встречается {n} раз (показано на схеме)',
 q:'Что означает этот символ?',looks:'Похоже на: {x}. Верно?',yes:'Да, верно',no:'Нет, выбрать другое',idk:'Не знаю',idkS:'Отмечу, проверим позже',
 back1:'Назад',next:'Дальше',another:'Выбрать другую картинку',
 doneT:'Схема открыта!',almost:'Почти готово',doneOk:'Все {n} кругов сходятся. Схема понятна, и я могу объяснить каждую петлю.',
 doneBad:'Круг {r} не сходится: берёт {a} петель, а предыдущий создаёт {b}. Возможно, один символ угадан неверно. Вернитесь и проверьте.',
 doneUnk:'Символов с пометкой «не знаю»: {n}. Их пока объяснить не получится.',
 start:'Начать учиться →',review:'Проверить ответы',tbl:'Показать числа по кругам',chkPer:'Круг {r}: берёт {a}, создаёт {b}',
 L:{knit:['лицевая','самая частая петля'],purl:['изнаночная','маленький бугорок спереди'],yo:['накид','намеренная дырочка'],k2tog:['две вместе лицевой','две петли в одну'],skp:['снять, провязать, протянуть','две в одну, наклон влево'],inc3:['одна в три','из одной петли три'],blank:['пустая клетка','на лицевой стороне это лицевая'],nostitch:['нет петли','заполнитель, пропустить'],unknown:['не знаю',''],cable:['коса или перекрест','пока не умею объяснять']}}
};
var IO={knit:[1,1],purl:[1,1],yo:[0,1],k2tog:[2,1],skp:[2,1],inc3:[1/3,1],blank:[1,1],nostitch:[0,0],unknown:[1,1],cable:[1,1]};
var TOK={knit:'k',blank:'k',cable:'u',purl:'p',yo:'yo',k2tog:'k2tog',skp:'skp',inc3:'I',unknown:'u'};
var lang='en'; try{lang=localStorage.getItem('cableBeanieLang')||((navigator.language||'').slice(0,2)==='ru'?'ru':'en');}catch(e){} if(!T[lang]) lang='en';
function t(k,v){ var s=(T[lang][k]!==undefined?T[lang][k]:T.en[k]); if(s===undefined) return k; if(v&&typeof s==='string') for(var q in v) s=s.split('{'+q+'}').join(v[q]); return s; }
function $(i){return document.getElementById(i);}
var src=document.createElement('canvas'), crop=null, last=null, labels={}, idx=0, finished=false;
var COLORS=[];for(var i=0;i<20;i++) COLORS.push('hsl('+(i*47%360)+',75%,48%)');

function statics(){
  document.documentElement.lang=lang; $('h1').textContent=t('h1'); $('back').textContent=t('back');
  $('intro').textContent=t('intro'); $('dropT').textContent=t('dropT'); $('dropS').textContent=t('dropS'); $('privacy').textContent=t('privacy'); $('exLink').textContent=t('exLink');
  $('cropHint').textContent=t('crop'); $('another').textContent=t('another'); $('reset').textContent=t('reset');
  $('lang').innerHTML=LANGS.map(function(l){return '<button data-l="'+l[0]+'" aria-pressed="'+(l[0]===lang)+'">'+l[1]+'</button>';}).join('');
  steps();
}
function steps(){
  var cur=!last?1:(last.ok&&!finished?2:(finished?3:1));
  $('steps').innerHTML=['s1','s2','s3'].map(function(k,i){return '<span class="'+(i+1===cur?'on':(i+1<cur?'done':''))+'">'+t(k)+'</span>';}).join('');
}
$('lang').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; lang=b.dataset.l; try{localStorage.setItem('cableBeanieLang',lang);}catch(x){} statics(); if(last) render(); });

function loadFile(f){
  if(!f||!/^image\//.test(f.type)) return;
  var url=URL.createObjectURL(f), im=new Image();
  im.onload=function(){
    var s=Math.min(1,1600/Math.max(im.width,im.height)); src.width=Math.round(im.width*s); src.height=Math.round(im.height*s);
    src.getContext('2d').drawImage(im,0,0,src.width,src.height); URL.revokeObjectURL(url); crop=null; labels={}; idx=0; finished=false; analyse();
  }; im.src=url;
}
$('file').addEventListener('change',function(){ loadFile(this.files[0]); });
var dr=$('drop');
['dragover','dragenter'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.add('over');});});
['dragleave','drop'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.remove('over');});});
dr.addEventListener('drop',function(e){ loadFile(e.dataTransfer.files[0]); });
document.addEventListener('paste',function(e){ var it=[].slice.call(e.clipboardData.items||[]).filter(function(i){return /^image\//.test(i.type);})[0]; if(it) loadFile(it.getAsFile()); });
$('reset').addEventListener('click',function(){ crop=null; labels={}; idx=0; finished=false; analyse(); });

function analyse(){
  var c=crop||{x:0,y:0,w:src.width,h:src.height}, cv=$('cv');
  var s=Math.min(2,1400/Math.max(c.w,c.h)); cv.width=Math.max(1,Math.round(c.w*s)); cv.height=Math.max(1,Math.round(c.h*s));
  var x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(src,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height);
  var ov=$('ov'); ov.width=cv.width; ov.height=cv.height;
  var res=Reader.analyze(Reader.grayFromCanvas(cv),cv.width,cv.height);
  last=res; $('upCard').hidden=true; $('out').hidden=false; $('reset').hidden=!crop;
  if(res.ok){ res.clusters.forEach(function(k){ if(labels[k.id]===undefined&&k.sug.label&&k.sug.score>=0.6&&T.en.L[k.sug.label]) labels[k.id]=k.sug.label; }); }
  render(); $('out').scrollIntoView({behavior:'smooth',block:'start'});
}
function rowsOf(res){
  var by={}; res.cells.forEach(function(q){ (by[q.r]=by[q.r]||[]).push(q); });
  return Object.keys(by).map(Number).sort(function(a,b){return b-a;}).map(function(r){return by[r].sort(function(a,b){return a.c-b.c;});});
}
function paintOverlay(only){
  var ov=$('ov'), cx=ov.getContext('2d'); cx.clearRect(0,0,ov.width,ov.height);
  if(!last||!last.ok) return;
  last.cells.forEach(function(q){
    var on=(only===undefined||q.cl===only);
    cx.fillStyle=on?'rgba(224,36,94,.28)':'rgba(255,255,255,.55)'; cx.fillRect(q.x0,q.y0,q.x1-q.x0,q.y1-q.y0);
    if(on){ cx.strokeStyle='#e0245e'; cx.lineWidth=2; cx.strokeRect(q.x0+1,q.y0+1,q.x1-q.x0-2,q.y1-q.y0-2); } });
}
function clusters(){ return last.clusters.filter(function(k){return k.kind==='sym'||k.kind==='blank'||k.kind==='filled';}); }
function autoKinds(){ // blank/filled clusters are answered for the user
  last.clusters.forEach(function(k){ if(labels[k.id]===undefined){ if(k.kind==='blank') labels[k.id]='blank'; else if(k.kind==='filled') labels[k.id]='nostitch'; } });
}
function ask(){ return last.clusters.filter(function(k){return k.kind==='sym';}); }

function render(){
  steps(); var side=$('side'), st=$('stage');
  st.classList.remove('pulse');
  if(!last.ok){
    paintOverlay(); st.classList.add('pulse'); finished=false;
    side.innerHTML='<div class="msg bad pop"><b>'+t(last.reason)+'</b></div><div class="msg"><b>'+t('cropHelp')+'</b></div>'; return; }
  autoKinds();
  var rows=rowsOf(last);
  if(finished){ doneView(rows); return; }
  var q=ask(), n=q.length;
  if(!n){ finished=true; steps(); doneView(rows); return; }
  idx=Math.max(0,Math.min(idx,n-1));
  var k=q[idx], cur=labels[k.id], sug=k.sug&&k.sug.label&&k.sug.score>=0.6&&T.en.L[k.sug.label]?k.sug.label:null;
  paintOverlay(k.cl!==undefined?k.id:undefined);
  var dots=q.map(function(o,i){return '<button data-i="'+i+'" class="'+(i===idx?'on ':'')+(labels[o.id]?'set':'')+'" aria-label="'+t('of',{i:i+1,n:n})+'"></button>';}).join('');
  var h='<div class="card pop" id="qc" style="display:grid;gap:14px"><div class="muted" style="font-size:14px">'+t('of',{i:idx+1,n:n})+'</div>'+
    '<div class="bar"><i style="width:'+Math.round(idx/n*100)+'%"></i></div>'+
    '<div class="big"><canvas id="bigsym" width="112" height="112"></canvas><div><h2>'+t('q')+'</h2><p class="muted" style="margin:4px 0 0;font-size:14px">'+t('appears',{n:k.cells.length})+'</p></div></div>';
  if(sug&&!labels['_pick'+k.id]){
    h+='<div class="msg"><b>'+t('looks',{x:t('L')[sug][0]})+'</b><div class="row" style="margin-top:10px"><button class="btn" data-yes="'+sug+'">'+t('yes')+'</button><button class="btn sec" data-no="1">'+t('no')+'</button></div></div>';
  }else{
    h+='<div class="tiles">'+['knit','purl','yo','k2tog','skp','inc3','cable','blank','nostitch','unknown'].map(function(o){return '<button class="tile" data-set="'+o+'"'+(cur===o?' style="border-color:var(--accent);background:var(--soft)"':'')+'><b>'+t('L')[o][0]+'</b>'+(t('L')[o][1]?'<small>'+t('L')[o][1]+'</small>':'')+'</button>';}).join('')+'</div>';
  }
  h+='<div class="row" style="justify-content:space-between"><div class="dots">'+dots+'</div><div class="row">'+(idx>0?'<button class="btn sec" data-nav="-1">'+t('back1')+'</button>':'')+(cur&&idx<n-1?'<button class="btn" data-nav="1">'+t('next')+'</button>':'')+(cur&&idx===n-1?'<button class="btn" data-fin="1">'+t('start')+'</button>':'')+'</div></div></div>';
  h+='<div class="msg">'+t('found',{rows:rows.length,cells:last.cells.length})+(last.warn?' '+t('warnBlur'):'')+'</div>';
  side.innerHTML=h;
  var bc=$('bigsym').getContext('2d'); bc.fillStyle='#fff'; bc.fillRect(0,0,112,112); var r=k.rep; bc.drawImage($('cv'),r.x0,r.y0,r.x1-r.x0,r.y1-r.y0,0,0,112,112);
}
$('side').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||!last||!last.ok) return; var q=ask(), k=q[idx];
  if(b.dataset.yes){ labels[k.id]=b.dataset.yes; advance(q); }
  else if(b.dataset.no){ labels['_pick'+k.id]=1; render(); }
  else if(b.dataset.set){ labels[k.id]=b.dataset.set; advance(q); }
  else if(b.dataset.nav){ idx+=+b.dataset.nav; render(); }
  else if(b.dataset.fin){ finish(); }
  else if(b.dataset.i){ idx=+b.dataset.i; render(); }
  else if(b.dataset.review){ finished=false; idx=0; render(); }
  else if(b.dataset.go){ go(); }
});
function advance(q){ if(idx<q.length-1){ idx++; render(); } else finish(); }
function finish(){ finished=true; render(); }

function counts(rows){
  var io=rows.map(function(r){ var a=0,b=0; r.forEach(function(q){ var p=IO[labels[q.cl]]||[1,1]; a+=p[0]; b+=p[1]; }); return [a,b]; }); return io;
}
function doneView(rows){
  paintOverlay(); var io=counts(rows), bad=[], unk=0;
  io.forEach(function(p,i){ if(i>0&&Math.abs(p[0]-io[i-1][1])>0.01) bad.push(i); });
  last.clusters.forEach(function(k){ if(labels[k.id]==='unknown'||labels[k.id]==='cable') unk+=1; });
  var tab='<table><tbody>'+io.map(function(p,i){return '<tr><td>'+t('chkPer',{r:i+1,a:+p[0].toFixed(1),b:+p[1].toFixed(1)})+'</td></tr>';}).join('')+'</tbody></table>';
  var h='<div class="card pop" style="display:grid;gap:12px"><h2>'+(bad.length?'🧶 '+t('almost'):'🎉 '+t('doneT'))+'</h2>'+
    (bad.length?'<div class="msg bad">'+t('doneBad',{r:bad[0]+1,a:io[bad[0]][0],b:io[bad[0]-1][1]})+'</div>':'<div class="msg"><b>✓</b> '+t('doneOk',{n:rows.length})+'</div>')+
    (unk?'<div class="msg">'+t('doneUnk',{n:unk})+'</div>':'')+
    '<div class="row"><button class="btn" data-go="1"'+(bad.length?' disabled style="opacity:.5"':'')+'>'+t('start')+'</button><button class="btn sec" data-review="1">'+t('review')+'</button></div>'+
    '<details><summary class="muted">'+t('tbl')+'</summary><div style="overflow-x:auto">'+tab+'</div></details></div>';
  $('side').innerHTML=h;
}
function go(){
  var rows=rowsOf(last), c0=Math.min.apply(null,last.cells.map(function(q){return q.c;}));
  var out=rows.map(function(r){ var cells=r.filter(function(q){return labels[q.cl]!=='nostitch';}).map(function(q){return TOK[labels[q.cl]]||'u';});
    return {off:(r[0].c-c0),cells:cells}; });
  try{ sessionStorage.setItem('knitUpload',JSON.stringify({rows:out,w:last.cells.reduce(function(m,q){return Math.max(m,q.c-c0+1);},0)})); }catch(e){}
  location.href='/?pattern=upload';
}

/* drag-to-crop */
(function(){ var ov=$('ov'), a=null;
  function pt(e){ var r=ov.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*ov.width,y:(e.clientY-r.top)/r.height*ov.height}; }
  ov.addEventListener('pointerdown',function(e){ a=pt(e); ov.setPointerCapture(e.pointerId); });
  ov.addEventListener('pointermove',function(e){ if(!a) return; var b=pt(e), c=ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height);
    c.strokeStyle='#e0245e'; c.lineWidth=3; c.setLineDash([8,5]); c.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y); c.setLineDash([]); });
  ov.addEventListener('pointerup',function(e){ if(!a) return; var b=pt(e), x0=Math.min(a.x,b.x), y0=Math.min(a.y,b.y), w=Math.abs(b.x-a.x), h=Math.abs(b.y-a.y); a=null;
    if(w<40||h<40){ if(last) render(); return; }
    var base=crop||{x:0,y:0,w:src.width,h:src.height}, f=base.w/ov.width;
    crop={x:Math.round(base.x+x0*f),y:Math.round(base.y+y0*f),w:Math.round(w*f),h:Math.round(h*f)}; labels={}; idx=0; finished=false; analyse(); });
})();
statics();
window.__readerDebug=function(){return {last:last,labels:labels};};
})();
</script>
