<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read a Chart</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#a2476b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f4f5f9;--surface:#fff;--fg:#1c2133;--muted:#586079;--line:#d6dae6;--accent:#a2476b;--on-accent:#fff;--bad:#b3261e;--ok:#1f7a4d;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--surface:#1d2030;--fg:#eceef6;--muted:#a3abc4;--line:#343954;--accent:#e08aae;--on-accent:#1a1020;--bad:#ff8a80;--ok:#6fd49c;--warn:#f2c26b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK JP",sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;display:grid;gap:16px}
h1{font:700 28px "Space Grotesk",Inter,sans-serif;margin:0;text-wrap:balance}
h2{font:700 17px "Space Grotesk",Inter,sans-serif;margin:0 0 8px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.muted{color:var(--muted)} a{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:9px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer}
button.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.stage{position:relative;line-height:0;touch-action:none;overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.stage canvas{max-width:100%;height:auto;display:block}
.msg{padding:12px 14px;border-radius:10px;border:1px solid var(--line);line-height:1.5}
.msg.bad{border-color:var(--bad)} .msg.bad b{color:var(--bad)}
.msg.ok{border-color:var(--ok)} .msg.ok b{color:var(--ok)}
.msg.warn{border-color:var(--warn)} .msg.warn b{color:var(--warn)}
.cl{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.cl .row{display:contents}
.cl canvas{border:1px solid var(--line);border-radius:6px;background:#fff;width:54px;height:54px}
.cl select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);max-width:100%}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
table{border-collapse:collapse;font-size:13px} td,th{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left}
.ovf{overflow-x:auto}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="h1"></h1>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="sec" id="back" href="/" style="text-decoration:none"></a><div class="seg" id="lang"></div></div></div>
<p class="muted" id="intro" style="margin:0"></p>

<div class="card">
  <label class="drop" id="drop" for="file"><b id="dropT"></b><br><span class="muted" id="dropS"></span></label>
  <input id="file" type="file" accept="image/*" hidden>
</div>

<div id="out" hidden>
 <div class="cols">
  <div class="card"><div class="stage" id="stage"><canvas id="cv"></canvas><canvas id="ov" style="position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair"></canvas></div>
   <p class="muted" id="cropHint" style="margin:8px 0 0;font-size:13px"></p>
   <div style="margin-top:8px"><button class="sec" id="reset" hidden></button></div></div>
  <div style="display:grid;gap:16px;align-content:start">
   <div id="status"></div>
   <div class="card" id="clCard" hidden><h2 id="clT"></h2><p class="muted" id="clS" style="margin:0 0 10px;font-size:13px"></p><div class="cl" id="cl"></div></div>
   <div class="card" id="chkCard" hidden><h2 id="chkT"></h2><div id="chk"></div></div>
  </div>
 </div>
</div>
</main>
<script src="/reader.js"></script>
<script>
(function(){
var LANGS=[['en','EN'],['ru','RU']];
var T={
en:{h1:'Read a chart',back:'← Examples',intro:'Upload a photo or screenshot of a knitting chart. Everything is read on your device; the image is never sent anywhere.',
 dropT:'Choose an image, drop it here, or paste it',dropS:'Photo, screenshot or scan of one chart',
 crop:'Drag a box on the picture to analyse only that part (for example, just the chart without the legend).',reset:'Use the whole picture',
 okT:'Chart found',okS:'{cells} cells in {rows} rounds. Symbols are grouped below: tell me what each group is.',
 tooSmall:'The image is too small to read symbols. Use a larger photo or screenshot.',
 lowContrast:'Contrast is too low: the lines and symbols barely differ from the background. Retake in even light without shadows, or scan it.',
 blurry:'Too blurry, or the chart is too small in the picture. Drag a box around only the chart, or retake it closer and in focus.',
 noGrid:'I can\'t find a grid of cells here. Either this is not a knitting chart, or the chart is small inside a bigger picture: drag a box around just the chart.',
 irregular:'I found lines, but they don\'t form an even grid. The page may be curved, tilted or photographed at an angle. Retake it flat, from straight above, or crop to the chart.',
 noSymbols:'I found a grid, but almost every cell is empty. Is the image too faint, or is this a blank template?',
 warnBlur:'The picture is a bit soft; check that the groups below look right.',
 fail:'Can\'t read this picture',clT:'Symbol groups',clS:'Each group is a set of cells that look alike. Pick what it means; I suggest a guess, but printed symbols differ between publishers.',
 count:'{n} cells',pick:'— choose —',
 chkT:'Stitch count check',tbl:'Show per-round counts',chkWait:'Label every group to run the check.',chkOk:'All {n} rounds add up: each round uses the stitches the round below made.',
 chkBad:'Round {r} uses {a} stitches, but the round below makes {b}. A group may be mislabelled, or a cell misread.',chkPer:'Round {r}: uses {a}, makes {b}',
 L:{knit:'knit',purl:'purl',yo:'yarn over',k2tog:'knit 2 together',skp:'slip, knit, pass over / ssk',inc3:'one stitch into three (one of its 3 cells)',slip:'slip stitch',cable:'cable (part of)',blank:'blank box (knit on right side)',nostitch:'no stitch (filled)',other:'other / ignore'}},
ru:{h1:'Прочитать схему',back:'← Примеры',intro:'Загрузите фото или скриншот схемы вязания. Всё читается на вашем устройстве; картинка никуда не отправляется.',
 dropT:'Выберите картинку, перетащите её сюда или вставьте',dropS:'Фото, скриншот или скан одной схемы',
 crop:'Выделите рамкой часть картинки, чтобы анализировать только её (например, саму схему без условных обозначений).',reset:'Вся картинка',
 okT:'Схема найдена',okS:'{cells} клеток, кругов: {rows}. Символы сгруппированы ниже: скажите, что значит каждая группа.',
 tooSmall:'Картинка слишком мала, чтобы разобрать символы. Нужно фото или скриншот побольше.',
 lowContrast:'Слишком низкий контраст: линии и символы почти не отличаются от фона. Переснимите при ровном свете без теней или отсканируйте.',
 blurry:'Слишком размыто, или схема занимает мало места на снимке. Выделите рамкой только схему или переснимите ближе и в фокусе.',
 noGrid:'Не нахожу сетку клеток. Либо это не схема вязания, либо схема мала на большой картинке: выделите рамкой только схему.',
 irregular:'Линии есть, но ровной сетки они не образуют. Возможно, страница изогнута, наклонена или снята под углом. Переснимите ровно, строго сверху, или обрежьте до схемы.',
 noSymbols:'Сетка найдена, но почти все клетки пустые. Картинка слишком бледная или это пустой шаблон?',
 warnBlur:'Снимок немного мягкий; проверьте, что группы ниже выглядят правильно.',
 fail:'Не удалось прочитать картинку',clT:'Группы символов',clS:'Группа — это клетки, которые выглядят одинаково. Выберите, что она значит; я подсказываю вариант, но символы в разных изданиях различаются.',
 count:'{n} клеток',pick:'— выберите —',
 chkT:'Проверка числа петель',tbl:'Показать числа по кругам',chkWait:'Подпишите все группы, чтобы запустить проверку.',chkOk:'Все {n} кругов сходятся: каждый круг берёт столько петель, сколько создал предыдущий.',
 chkBad:'Круг {r} берёт {a} петель, а предыдущий создаёт {b}. Возможно, группа подписана неверно или клетка прочитана неверно.',chkPer:'Круг {r}: берёт {a}, создаёт {b}',
 L:{knit:'лицевая',purl:'изнаночная',yo:'накид',k2tog:'две вместе лицевой',skp:'снять, провязать, протянуть / ssk',inc3:'одна петля в три (одна из 3 клеток)',slip:'снятая петля',cable:'коса (часть)',blank:'пустая клетка (лицевая по лицевой стороне)',nostitch:'нет петли (закрашено)',other:'другое / пропустить'}}
};
var IO={knit:[1,1],purl:[1,1],yo:[0,1],k2tog:[2,1],skp:[2,1],slip:[1,1],cable:[1,1],blank:[1,1],nostitch:[0,0],other:[1,1],inc3:[1/3,1]};
var lang='en'; try{lang=localStorage.getItem('cableBeanieLang')||((navigator.language||'').slice(0,2)==='ru'?'ru':'en');}catch(e){} if(!T[lang]) lang='en';
function t(k,v){ var s=(T[lang][k]!==undefined?T[lang][k]:T.en[k])||k; if(v) for(var q in v) s=s.split('{'+q+'}').join(v[q]); return s; }
function $(i){return document.getElementById(i);}
var src=document.createElement('canvas'), crop=null, last=null, labels={};
var COLORS=[];for(var i=0;i<14;i++) COLORS.push('hsl('+(i*47%360)+',70%,50%)');

function statics(){
  document.documentElement.lang=lang; $('h1').textContent=t('h1'); $('back').textContent=t('back'); $('back').className='sec';
  $('intro').textContent=t('intro'); $('dropT').textContent=t('dropT'); $('dropS').textContent=t('dropS');
  $('cropHint').textContent=t('crop'); $('reset').textContent=t('reset'); $('clT').textContent=t('clT'); $('clS').textContent=t('clS'); $('chkT').textContent=t('chkT');
  $('lang').innerHTML=LANGS.map(function(l){return '<button data-l="'+l[0]+'" aria-pressed="'+(l[0]===lang)+'">'+l[1]+'</button>';}).join('');
}
$('lang').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; lang=b.dataset.l; try{localStorage.setItem('cableBeanieLang',lang);}catch(x){} statics(); if(last) renderResult(); });

function loadFile(f){
  if(!f||!/^image\//.test(f.type)) return;
  var url=URL.createObjectURL(f), im=new Image();
  im.onload=function(){
    var s=Math.min(1,1600/Math.max(im.width,im.height)); src.width=Math.round(im.width*s); src.height=Math.round(im.height*s);
    src.getContext('2d').drawImage(im,0,0,src.width,src.height); URL.revokeObjectURL(url); crop=null; labels={}; analyse();
  }; im.src=url;
}
$('file').addEventListener('change',function(){ loadFile(this.files[0]); });
var dr=$('drop');
['dragover','dragenter'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.add('over');});});
['dragleave','drop'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.remove('over');});});
dr.addEventListener('drop',function(e){ loadFile(e.dataTransfer.files[0]); });
document.addEventListener('paste',function(e){ var it=[].slice.call(e.clipboardData.items||[]).filter(function(i){return /^image\//.test(i.type);})[0]; if(it) loadFile(it.getAsFile()); });
$('reset').addEventListener('click',function(){ crop=null; labels={}; analyse(); });

function analyse(){
  var c=crop||{x:0,y:0,w:src.width,h:src.height}, cv=$('cv');
  var s=Math.min(2,1400/Math.max(c.w,c.h)); cv.width=Math.max(1,Math.round(c.w*s)); cv.height=Math.max(1,Math.round(c.h*s));
  var x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(src,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height);
  var ov=$('ov'); ov.width=cv.width; ov.height=cv.height;
  var res=Reader.analyze(Reader.grayFromCanvas(cv),cv.width,cv.height);
  last=res; $('out').hidden=false; $('reset').hidden=!crop;
  if(res.ok){ // preset suggestions
    res.clusters.forEach(function(k){ if(labels[k.id]===undefined&&k.sug.label&&k.sug.score>=0.6) labels[k.id]=k.sug.label; }); }
  renderResult(); $('out').scrollIntoView({behavior:'smooth',block:'start'});
}

function rowsOf(res){ // rows bottom -> top, cells left -> right
  var by={}; res.cells.forEach(function(q){ (by[q.r]=by[q.r]||[]).push(q); });
  return Object.keys(by).map(Number).sort(function(a,b){return b-a;}).map(function(r){return by[r].sort(function(a,b){return a.c-b.c;});});
}
function renderResult(){
  var res=last, st=$('status'), ov=$('ov'), cx=ov.getContext('2d'); cx.clearRect(0,0,ov.width,ov.height);
  if(!res.ok){ st.innerHTML='<div class="msg bad"><b>'+t('fail')+'.</b> '+t(res.reason)+'</div>'; $('clCard').hidden=true; $('chkCard').hidden=true; return; }
  var rows=rowsOf(res);
  st.innerHTML='<div class="msg ok"><b>'+t('okT')+'.</b> '+t('okS',{cells:res.cells.length,rows:rows.length})+'</div>'+(res.warn?'<div class="msg warn" style="margin-top:8px">'+t('warnBlur')+'</div>':'');
  res.cells.forEach(function(q){ cx.fillStyle=COLORS[q.cl%COLORS.length].replace('hsl','hsla').replace(')',',.22)'); cx.fillRect(q.x0,q.y0,q.x1-q.x0,q.y1-q.y0);
    cx.strokeStyle=COLORS[q.cl%COLORS.length]; cx.lineWidth=1.5; cx.strokeRect(q.x0+1,q.y0+1,q.x1-q.x0-2,q.y1-q.y0-2); });
  $('clCard').hidden=false;
  var h=''; res.clusters.forEach(function(k){
    var opts='<option value="">'+t('pick')+'</option>'+Object.keys(T.en.L).map(function(o){return '<option value="'+o+'"'+(labels[k.id]===o?' selected':'')+'>'+t('L')[o]+'</option>';}).join('');
    h+='<div class="row"><canvas data-cl="'+k.id+'" width="54" height="54"></canvas><div><span class="sw" style="background:'+COLORS[k.id%COLORS.length]+'"></span>'+t('count',{n:k.cells.length})+'<br><select data-cl="'+k.id+'">'+opts+'</select></div></div>'; });
  $('cl').innerHTML=h;
  res.clusters.forEach(function(k){ var cv=$('cl').querySelector('canvas[data-cl="'+k.id+'"]'), q=k.rep, c=cv.getContext('2d');
    c.fillStyle='#fff'; c.fillRect(0,0,54,54); c.drawImage($('cv'),q.x0,q.y0,q.x1-q.x0,q.y1-q.y0,0,0,54,54); });
  renderCheck(rows);
}
$('cl').addEventListener('change',function(e){ var s=e.target.closest('select'); if(!s) return; labels[s.dataset.cl]=s.value||undefined; renderCheck(rowsOf(last)); });
function renderCheck(rows){
  var res=last, unl=res.clusters.some(function(k){return !labels[k.id];}); $('chkCard').hidden=false;
  if(unl){ $('chk').innerHTML='<span class="muted">'+t('chkWait')+'</span>'; return; }
  var io=rows.map(function(r){ var a=0,b=0; r.forEach(function(q){ var p=IO[labels[q.cl]]||[1,1]; a+=p[0]; b+=p[1]; }); return [a,b]; });
  var bad=[],tab='<table><tbody>'; io.forEach(function(p,i){ tab+='<tr><td>'+t('chkPer',{r:i+1,a:+p[0].toFixed(1),b:+p[1].toFixed(1)})+'</td></tr>'; if(i>0&&Math.abs(p[0]-io[i-1][1])>0.01) bad.push(i); });
  tab+='</tbody></table>';
  var m=bad.length?bad.map(function(i){return '<div class="msg bad" style="margin-bottom:6px">'+t('chkBad',{r:i+1,a:io[i][0],b:io[i-1][1]})+'</div>';}).join(''):'<div class="msg ok"><b>✓</b> '+t('chkOk',{n:rows.length})+'</div>';
  $('chk').innerHTML=m+'<details style="margin-top:8px"><summary class="muted">'+t('tbl')+'</summary><div class="ovf">'+tab+'</div></details>';
}

/* drag-to-crop on the overlay */
(function(){ var ov=$('ov'), a=null;
  function pt(e){ var r=ov.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*ov.width,y:(e.clientY-r.top)/r.height*ov.height}; }
  ov.addEventListener('pointerdown',function(e){ a=pt(e); ov.setPointerCapture(e.pointerId); });
  ov.addEventListener('pointermove',function(e){ if(!a) return; var b=pt(e), c=ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height);
    c.strokeStyle='#e0245e'; c.lineWidth=2; c.setLineDash([6,4]); c.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y); c.setLineDash([]); });
  ov.addEventListener('pointerup',function(e){ if(!a) return; var b=pt(e), x0=Math.min(a.x,b.x), y0=Math.min(a.y,b.y), w=Math.abs(b.x-a.x), h=Math.abs(b.y-a.y); a=null;
    if(w<40||h<40){ if(last) renderResult(); return; }
    var base=crop||{x:0,y:0,w:src.width,h:src.height}, f=base.w/ov.width;
    crop={x:Math.round(base.x+x0*f),y:Math.round(base.y+y0*f),w:Math.round(w*f),h:Math.round(h*f)}; labels={}; analyse(); });
})();
statics();
window.__readerDebug=function(){return {last:last,labels:labels};};
})();
</script>
</body>
</html>
