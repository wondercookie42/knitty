<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Read a Chart</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#a2476b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#f4f5f9;--surface:#fff;--fg:#1c2133;--muted:#586079;--line:#d6dae6;--accent:#a2476b;--on-accent:#fff;--soft:#f6e6ee;--bad:#b3261e;--ok:#1f7a4d;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--surface:#1d2030;--fg:#eceef6;--muted:#a3abc4;--line:#343954;--accent:#e08aae;--on-accent:#1a1020;--soft:#35202b;--bad:#ff8a80;--ok:#6fd49c;--warn:#f2c26b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK JP",sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:920px;margin:0 auto;display:grid;gap:16px}
h1{font:700 30px "Space Grotesk",Inter,sans-serif;margin:0;text-wrap:balance}
h2{font:700 20px "Space Grotesk",Inter,sans-serif;margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.muted{color:var(--muted)} a{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--soft)}
.drop b{font-size:19px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px 20px;font:600 16px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.steps span{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps span.done{background:var(--soft);color:var(--fg)}
.stage{position:relative;line-height:0;touch-action:none;overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.stage canvas{max-width:100%;height:auto;display:block}
.stage.pulse{box-shadow:0 0 0 3px var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.msg{padding:14px 16px;border-radius:12px;background:var(--soft)}
.msg.bad{border:1px solid var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.big{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big canvas{width:112px;height:112px;border:2px solid var(--line);border-radius:14px;background:#fff;image-rendering:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;min-height:48px}
.tile:hover{border-color:var(--accent);background:var(--soft)}
.tile small{display:block;color:var(--muted)}
.tile .gl{display:flex;gap:4px;margin-bottom:6px;color:var(--fg)}
.tiles+.muted{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;cursor:pointer}
.dots button.on{border-color:var(--accent)} .dots button.set{background:var(--accent);border-color:var(--accent)}
.tool{display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;text-align:left;cursor:pointer;width:100%}
.tool.on{border-color:var(--c)}
.tool i{width:16px;height:16px;border-radius:4px;background:var(--c);flex:none}
.tool small{margin-left:auto;color:var(--muted)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:14px}
.tbar .btn{padding:6px 12px;font-size:14px}
.fine{display:flex;gap:6px;align-items:center;flex:1 1 240px;min-width:0}.fine input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}.fine output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.tbar label.chk{display:flex;gap:6px;align-items:center;cursor:pointer}
.keybox{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;line-height:0}
.keybox canvas{width:100%;height:auto;display:block}
table{border-collapse:collapse;font-size:13px} td{border-bottom:1px solid var(--line);padding:3px 8px}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="h1"></h1>
 <div class="row"><a class="btn sec" id="back" href="/" style="padding:6px 12px;font-size:14px"></a><div class="seg" id="lang"></div></div></div>
<div class="steps" id="steps" aria-label="progress"></div>

<div class="card" id="upCard">
  <p id="intro" style="margin:0 0 14px;font-size:17px"></p>
  <label class="drop" id="drop" for="file"><b id="dropT"></b><br><span class="muted" id="dropS"></span></label>
  <input id="file" type="file" accept="image/*" hidden><input id="keyfile" type="file" accept="image/*" hidden>
  <p class="muted" style="margin:12px 0 0;font-size:14px"><span id="privacy"></span> <a href="/" id="exLink"></a></p>
</div>

<div id="out" hidden>
 <div class="cols">
  <div class="card">
    <div class="tbar" id="tbar" hidden><button class="btn sec" id="rotL"></button><button class="btn sec" id="rotR"></button><span class="fine"><button class="btn sec" id="wNudgeL" aria-label="-1°">−1°</button><input type="range" id="wfine" min="-45" max="45" step="0.5" value="0" aria-label="fine rotation"><button class="btn sec" id="wNudgeR" aria-label="+1°">+1°</button><output id="wval">0°</output></span><label class="chk"><input type="checkbox" id="auto" checked> <span id="autoT"></span></label></div>
    <div class="stage" id="stage"><canvas id="cv"></canvas><canvas id="ov" style="position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair"></canvas></div>
    <p class="muted" id="cropHint" style="margin:8px 0 0;font-size:14px"></p>
    <div id="keyHolder" style="margin-top:12px"></div>
    <div class="row" style="margin-top:8px"><label class="btn sec" for="file" id="another"></label><button class="btn sec" id="markAgain" hidden></button></div>
  </div>
  <div style="display:grid;gap:16px;align-content:start" id="side"></div>
 </div>
</div>
</main>
<script src="/symbols.js"></script><script src="/keydict.js"></script><script src="/reader.js"></script>

  drawPrevs(); });
function drawPrevs(){
  ['chart','key','text'].forEach(function(k){ var b=boxes[k], cv=document.querySelector('canvas[data-prev="'+k+'"]'); if(!b||!cv) return;
    var c=regionOf(k==='key'&&keySrc?keySrc:src,b); cv.width=c.width; cv.height=c.height; cv.getContext('2d').drawImage(c,0,0); });
}
var GL={
  knit:['<path d="M14 6V22"/>',''], purl:['<path d="M6 14H22"/>','<circle cx="14" cy="14" r="2.6" fill="currentColor"/>'],
  yo:['<circle cx="14" cy="14" r="6"/>','<path d="M8 6V15A6 6 0 0 0 20 15V6"/>'],
  k2tog:['<path d="M7 22L21 6"/>','<path d="M7 7L14 22L21 7"/>'], skp:['<path d="M7 6L21 22"/>','<path d="M14 5V21M9 16L14 21L19 16"/>'],
  ktbl:['<path d="M20 6L8 14L20 22"/>'], k3tog:['<path d="M7 7L14 22L21 7"/>','<text x="14" y="14" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">3</text>'], sk2p:['<path d="M14 23V6M9 12L14 6L19 12"/>'],
  inc3:['<path d="M4 21Q14 29 24 21"/><path d="M14 6V19"/>'], cable:['<path d="M6 6L22 22M22 6L6 22"/>'],
  blank:[''], nostitch:['<rect x="3" y="3" width="22" height="22" fill="currentColor" opacity=".25" stroke="none"/>'],
  unknown:['<text x="14" y="21" text-anchor="middle" font-size="18" fill="currentColor" stroke="none">?</text>']};
function glyphs(o){ return (GL[o]||[]).map(function(g){ return '<svg viewBox="0 0 28 28" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="3" stroke="var(--line)" stroke-width="1.5"/>'+g+'</svg>'; }).join(''); }
function nearestNamed(k){
  var best=null; last.clusters.forEach(function(o){ if(o===k||o.kind!=='sym'||!confirmed[o.id]||!labels[o.id]||labels[o.id]==='unknown'||labels[o.id]==='cable') return;
    var d=Reader.sdist(k.v,o.v); if(d<0.5&&(!best||d<best.d)) best={d:d,l:labels[o.id]}; });
  return best&&best.l;
}
function matchKey(k){
  if(!keyInfo||!keyInfo.lines.length) return null; var best=null;
  keyInfo.lines.forEach(function(L){ var d=Reader.sdist(k.v,L.fp); if(!best||d<best.d) best={d:d,L:L}; });
  return best&&best.d<0.55?best:null;
}
$('side').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(mode==='mark'){
    if(b.dataset.tool){ tool=b.dataset.tool; render(); }
    else if(b.dataset.rot){ var pr=b.dataset.rot.split(':'); var bx=boxes[pr[0]]; if(bx){ addRot(pr[0],+pr[1]); } render(); }
    else if(b.dataset.del){ var dk=b.dataset.del; boxes[dk]=null; if(dk==='key'){ keySrc=null; } tool=dk; render(); }
    else if(b.dataset.nokey){ noKey=true; boxes.key=null; keySrc=null; tool='chart'; render(); }
    else if(b.dataset.read){ readNow(false); }
    else if(b.dataset.whole){ boxes.chart=null; readNow(false); }
    return; }
  if(!last||!last.ok) return; var q=ask(), k=q[idx];
  if(b.dataset.yes){ labels[k.id]=b.dataset.yes; confirmed[k.id]=1; advance(q); }
  else if(b.dataset.no){ labels['_pick'+k.id]=1; render(); }
  else if(b.dataset.set){ labels[k.id]=b.dataset.set; confirmed[k.id]=1; advance(q); }
  else if(b.dataset.nav){ idx+=+b.dataset.nav; render(); }
  else if(b.dataset.fin){ finish(); }
  else if(b.dataset.i){ idx=+b.dataset.i; render(); }
  else if(b.dataset.review){ reviewAll=true; finished=false; idx=0; render(); }
  else if(b.dataset.go){ go(); }
});
function advance(q){ if(idx<q.length-1){ idx++; render(); } else finish(); }
function finish(){ finished=true; render(); }

function counts(rows){
  return rows.map(function(r){ var a=0,b=0; r.forEach(function(q){ var p=IO[labels[q.cl]]||[1,1]; a+=p[0]; b+=p[1]; }); return [a,b]; });
}
function doneView(rows){
  var ovx=$('ov'); ovx.getContext('2d').clearRect(0,0,ovx.width,ovx.height); var io=counts(rows), bad=[], unk=0;
  io.forEach(function(p,i){ if(i>0&&Math.abs(p[0]-io[i-1][1])>0.01) bad.push(i); });
  last.clusters.forEach(function(k){ if(labels[k.id]==='unknown'||labels[k.id]==='cable') unk+=1; });
  var tab='<table><tbody>'+io.map(function(p,i){return '<tr><td>'+t('chkPer',{r:i+1,a:+p[0].toFixed(1),b:+p[1].toFixed(1)})+'</td></tr>';}).join('')+'</tbody></table>';
  var h='<div class="card pop" style="display:grid;gap:12px"><h2>'+(bad.length?'🧶 '+t('almost'):'🎉 '+t('doneT'))+'</h2>'+
    (bad.length?'<div class="msg bad">'+t('doneBad',{r:bad[0]+1,a:+io[bad[0]][0].toFixed(1),b:+io[bad[0]-1][1].toFixed(1)})+'</div>':'<div class="msg"><b>✓</b> '+t('doneOk',{n:rows.length})+'</div>')+
    (last.clusters.some(function(k){return k.autoKey&&confirmed[k.id];})?'<div class="msg"><b>'+t('keyDoneT')+'</b><div style="display:grid;gap:6px;margin-top:8px">'+last.clusters.filter(function(k){return k.autoKey&&confirmed[k.id];}).map(function(k){ return '<div class="row" style="gap:8px">'+glyphs(labels[k.id])+'<span>'+t('L')[labels[k.id]][0]+'</span></div>'; }).join('')+'</div></div>':'')+
    (unk?'<div class="msg">'+t('doneUnk',{n:unk})+'</div>':'')+
    '<div class="row"><button class="btn" data-go="1"'+'>'+t('start')+'</button><button class="btn sec" data-review="1">'+t('review')+'</button></div>'+
    '<details><summary class="muted">'+t('tbl')+'</summary><div style="overflow-x:auto">'+tab+'</div></details></div>';
  $('side').innerHTML=h;
}
function go(){
  var rows=rowsOf(last), c0=Math.min.apply(null,last.cells.map(function(q){return q.c;}));
  var out=rows.map(function(r){ var cells=r.filter(function(q){return labels[q.cl]!=='nostitch';}).map(function(q){return TOK[labels[q.cl]]||'u';});
    return {off:(r[0].c-c0),cells:cells}; });
  try{ sessionStorage.setItem('knitUpload',JSON.stringify({rows:out,w:last.cells.reduce(function(m,q){return Math.max(m,q.c-c0+1);},0)})); }catch(e){}
  location.href='/?pattern=upload';
}

/* drag-to-mark (mark mode only) */
(function(){ var ov=$('ov'), a=null;
  function pt(e){ var r=ov.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*ov.width,y:(e.clientY-r.top)/r.height*ov.height}; }
  function box(a,b){ return {x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)}; }
  ov.addEventListener('pointerdown',function(e){ if(mode!=='mark') return; a=pt(e); ov.setPointerCapture(e.pointerId); });
  ov.addEventListener('pointermove',function(e){ if(!a) return; paintBoxes(box(a,pt(e))); });
  ov.addEventListener('pointerup',function(e){ if(!a) return; var b=box(a,pt(e)); a=null;
    if(b.w<30||b.h<30){ paintBoxes(); return; }
    b.rot=(tool!=='chart'&&boxes.chart)?boxes.chart.rot:0; boxes[tool]=b; if(tool==='key') keySrc=null; if(tool==='chart'&&!boxes.key&&!noKey) tool='key'; failReason=null; render(); });
})();
statics();
window.__readerDebug=function(){return {lineCanvas:lineCanvas,keyCv:keyCv,keyInfo:keyInfo,keyBusy:keyBusy,last:last,labels:labels,failReason:failReason,region:function(){return prep(regionOf(src,boxes.chart));}};};
})();
</script>
