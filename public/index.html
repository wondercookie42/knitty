<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knit Chart Guide</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#a2476b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: interactive chart on the left, round-by-round inspector on the right, skippable lessons below. Language switcher top right. */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --fg:#1c2133; --muted:#586079; --line:#d6dae6;
  --accent:#a2476b; --on-accent:#ffffff;
  --cell-p:#eceff6; --cell-v:#fcefcf; --cell-a:#dcf0f3; --cell-b:#e8e3f7;
  --s1:#a2476b; --s2:#1f7a8c; --s3:#6c4fb8; --on-s:#ffffff;
  --nl:#8b93ab; --nr:#7a839f; --nh:#c9cfdf; --nc:#9a8fb8; --y0:#aab1c6; --yarn:#d4739a; --bad:#b3261e;
  --font-display:"Space Grotesk",Inter,system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Yu Gothic","Microsoft YaHei",sans-serif;
  --font-body:Inter,system-ui,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Noto Sans CJK JP","Yu Gothic","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141e; --surface:#1a1f2e; --fg:#e8eaf2; --muted:#a3a9bf; --line:#333954;
    --accent:#e48fae; --on-accent:#11141e;
    --cell-p:#252b40; --cell-v:#4a3e1d; --cell-a:#1d3f46; --cell-b:#342c52;
    --s1:#e48fae; --s2:#5cc0d3; --s3:#b6a0f2; --on-s:#11141e;
    --nl:#6c7491; --nr:#7b84a3; --nh:#98a1bd; --nc:#8f86b4; --y0:#6a7290; --yarn:#e48fae; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141e; --surface:#1a1f2e; --fg:#e8eaf2; --muted:#a3a9bf; --line:#333954;
  --accent:#e48fae; --on-accent:#11141e;
  --cell-p:#252b40; --cell-v:#4a3e1d; --cell-a:#1d3f46; --cell-b:#342c52;
  --s1:#e48fae; --s2:#5cc0d3; --s3:#b6a0f2; --on-s:#11141e;
  --nl:#6c7491; --nr:#7b84a3; --nh:#98a1bd; --nc:#8f86b4; --y0:#6a7290; --yarn:#e48fae; --bad:#ff8a80;
  color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg); font:15px/1.55 var(--font-body);
  padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:28px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.ru{font-size:13px;color:var(--muted);font-style:italic}
header{display:flex;flex-direction:column;gap:10px}
.head-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
header p{max-width:64ch}
.lang,.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button,.seg button{border:0;border-radius:0;padding:6px 12px;background:transparent;font:600 13px var(--font-body);color:var(--muted)}
.lang button+button,.seg button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.chart-card{display:flex;flex-direction:column;gap:12px}
#chart{width:100%;height:auto;display:block;border-radius:6px;touch-action:manipulation}
#chart:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cell{stroke:var(--line);stroke-width:1;cursor:pointer}
.t-k{fill:var(--surface)} .t-p{fill:var(--cell-p)} .t-v{fill:var(--cell-v)}
.t-A{fill:var(--cell-a)} .t-B{fill:var(--cell-b)}
.sym path{fill:none;stroke:var(--fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sym path.thin{stroke-width:1.6;opacity:.75}
.band{fill:var(--accent);opacity:.13;pointer-events:none}
.pick{fill:none;stroke:var(--accent);stroke-width:3;pointer-events:none}
.axis{font:500 14px var(--font-body);fill:var(--muted)}
.axis.on{fill:var(--accent);font-weight:700}
.rowlabel{cursor:pointer}
.bracket{stroke:var(--muted);stroke-width:1.5;fill:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:30px;height:30px;flex:none}
.legend .sw{stroke:var(--line);stroke-width:1}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--cell-p);font:600 13px var(--font-body)}
.chip.A{background:var(--cell-a)} .chip.B{background:var(--cell-b)} .chip.v{background:var(--cell-v)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 14px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lessons-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.lessons{display:flex;flex-direction:column;gap:12px;max-width:820px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lesson.skipped{padding:10px 16px;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lesson.flash{border-color:var(--accent)}
.lesson-top{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:flex-start}
.lesson-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.level{display:inline-block;font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lesson ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.seg{align-self:flex-start}
.bars{display:flex;flex-wrap:wrap;gap:8px}
.badrow{fill:none;stroke:var(--bad);stroke-width:2.5;pointer-events:none}
.axis.bad{fill:var(--bad);font-weight:700}
.ghostc .cell{fill:none;stroke-dasharray:3 3}
.ghostc .sym{opacity:.4}
.arc{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;pointer-events:none}
.chk-bad{color:var(--bad);font-weight:600}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details table{margin-top:8px}
.animset{display:flex;flex-direction:column;gap:8px;max-width:560px}
.anim{display:flex;flex-direction:column;gap:8px;max-width:560px}
.anim svg{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;display:block}
.nd{fill:var(--line)}
.yarn{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5}
.cn{fill:none;stroke:var(--muted);stroke-width:2}
.cn.back{stroke-dasharray:5 4}
.albl{font:500 11px var(--font-body);fill:var(--muted)}
.anim-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:28px;height:28px;padding:0;border-radius:999px;font-size:12px;font-variant-numeric:tabular-nums}
.dots button[aria-current="step"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.anim .cap{min-height:3.2em;font-size:14px}
.sub{margin-top:4px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:420px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
td.num{font-variant-numeric:tabular-nums}
.sched{display:grid;grid-template-columns:auto repeat(14,minmax(18px,1fr));gap:3px;align-items:center;font-size:12px;min-width:420px}
.sched .lab{color:var(--muted);padding-right:8px;white-space:nowrap}
.sched .rn{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.sched .b{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--cell-p);border:1px solid var(--line)}
.sched .b.v{background:var(--cell-v)} .sched .b.x{background:var(--cell-a)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;max-width:820px}
@media (prefers-reduced-motion:no-preference){.lesson{transition:border-color .3s}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="head-top">
      <h1 id="h1T"></h1>
      <div class="bars"><div class="seg" id="patBar" role="group"></div><div class="lang" id="langBar" role="group"></div></div>
    </div>
    <p class="muted" id="introP"></p>
    <div class="facts" id="facts"></div>
  </header>

  <section class="main">
    <div class="card chart-card">
      <h2 data-i18n="chartH"></h2>
      <svg id="chart" viewBox="0 0 608 626" tabindex="0" role="group"></svg>
      <div class="legend" id="legend"></div>
      <p class="hint" id="chartHintP"></p>
    </div>
    <div class="stack">
      <div class="card stack" id="roundCard" aria-live="polite"></div>
      <div class="card stack" id="stitchCard" aria-live="polite"></div>
      <div class="card stack" id="checkCard"></div>
    </div>
  </section>

  <section class="stack">
    <div class="lessons-head">
      <div class="stack" style="gap:4px">
        <h2 data-i18n="lessonsH"></h2>
        <p class="muted small" id="progress"></p>
      </div>
      <div class="row-actions">
        <button type="button" id="skipBasics" data-i18n="skipBasics"></button>
        <button type="button" id="resetSkips" data-i18n="showAll"></button>
      </div>
    </div>
    <div class="lessons" id="lessons"></div>
    <p class="note" id="noteP"></p>
  </section>
</div>

<script>
(function(){

  en:{
    h1:'Cable Beanie Guide',

    where:'Column {c}, round {r}.',
    pTitle:'Purl stitch', pBody:'Purl this stitch. Columns 1 and 8 are purl stitches in every round. They run straight up between the two ovals and keep each oval visually separate.',

    bTitle:'Cable B (part {i} of 3)', bBody:'This cell belongs to a three-stitch cross that spans columns {c1} to {c2}. Slip 1 stitch onto a cable needle and hold it in front, knit the next 2 stitches, then knit the stitch from the cable needle. It is worked right after cable A.',
    openLesson:'Open the lesson: {title}',
    lessonsH:'Learn this pattern',
    progress:'{n} of {total} lessons skipped. Lessons run from the basics to the cables.',
    skipBasics:'I know the basics', showAll:'Show everything',
    skipThis:'I know this', showAgain:'Show again', skippedTag:'(skipped)',
    note:'This is a prototype built from one pattern. The chart and lessons here were transcribed by hand from the screenshot, so check the chart against the original before you knit from it. The finished app would read any chart you give it and write these lessons for it.',

    play:'Play', pause:'Pause', back:'Back', next:'Next', goStep:'Go to step {n}',
    animAria:'{label}, animated step by step',

    lblCnFront:'cable needle, held in front', lblCnBack:'cable needle, held behind',

    schedAria:'Which rounds slip and which rounds cross, for each oval',
    schedHint:'S = slip round, X = crossing round. Round numbers are along the top.',

    thRound:'Round', thWork:'Work', thSts:'Stitches',
    crownHint:'Stars mark the part you repeat around the whole round.',

    lessons:{
      caston:{title:'Cast on and join in the round',steps:['Cast on 76 stitches on the 4 mm circular needle, plus 1 extra stitch for joining.','Check that the cast-on edge lies flat all the way around with no twist.','Close the circle. A common way is to knit the extra stitch together with the first stitch, which leaves 76. Place a marker to show the start of the round.']},

      k2tog:{title:'Knit 2 together',steps:['Put the right needle through the next two stitches at once, as if to knit.','Wrap the yarn and pull the loop through both.','Let both old stitches slide off. Two stitches have become one, leaning to the right.']},
      skp:{title:'Slip 1, knit 1, pass over',steps:['Slip one stitch as if to knit, without working it.','Knit the next stitch.','Lift the slipped stitch over the knitted one and off the needle. Two stitches have become one, leaning to the left.']},
      inc3:{title:'One stitch into three',steps:['Knit into the stitch but keep it on the left needle.','Make a yarn over.','Knit into the same stitch again, then let it drop. One stitch has become three: knit, yarn over, knit.']},
      sFinish:{title:'Finish with the crochet hook',steps:['After round 12, take each group of stitches joined by an arc at the top of the chart onto the crochet hook and crochet them together. Between the groups, chain as many stitches as the numbers above the arcs say.','Fasten off at the end of the round. This lesson has no animation yet, because it uses a crochet hook.','Block the star into shape and let it dry, as the magazine describes.']},
      cableB:{title:'Cable B: one stitch crosses in front',steps:[]},
      cableA:{title:'Cable A: two stitches wait behind',steps:[]},
      oval:{title:'Put an oval together',steps:['Each oval is six stitches wide and is made from one cable A and one cable B side by side, worked in the same round. Cable A comes first, then cable B.','Every crossing round follows a slip round. The round before each crossing has two slipped stitches in the middle of the oval.','The two ovals are offset. The left oval crosses in rounds 3, 5 and 7, the right oval in rounds 9, 11 and 13.','Round 14 is a slip round for the left oval, which is why repeating rounds 3 to 14 leads straight into the left oval crossing in round 3.']},
      crown:{title:'Shape the crown',steps:['After the last chart repeat, work the six decrease rounds in the table. Stars mark the part you repeat around the round.','A left-leaning decrease is usually slip, slip, knit those two together. A right-leaning decrease is knit 2 together.','When 12 stitches remain, cut the yarn, thread it through all of them, and pull tight to close the top.']}
    },
    needle:{
      yo:{label:'Yarn over',steps:['The yarn waits at the back after the last knit stitch. The next stitch waits on the left needle.','Bring the yarn forward between the needles, to the front of the work.','Lay the yarn over the right needle, from front to back. The loop on the needle is the yarn over.','Knit the next stitch as usual. The yarn over stays on the needle as a stitch of its own and leaves an eyelet hole in the next round.']},
      skp:{label:'Slip, knit, pass over',steps:['Two stitches wait on the left needle. The yarn is at the back.','Slip the first stitch to the right needle as if to knit, without working it.','Put the right needle through the next stitch, as if to knit.','Wrap the yarn around the right needle tip.','Pull the new loop through and let the old stitch slide off.','Lift the slipped stitch over the new stitch and off the needle. Two stitches have become one, leaning to the left.']},
      inc3:{label:'One stitch into three',steps:['One stitch waits on the left needle.','Knit into the stitch, but keep it on the left needle.','Make a yarn over.','Knit into the same stitch again.','Now let the old stitch slide off. One stitch has become three: knit, yarn over, knit.']},
      knit:{label:'Knit stitch',steps:['The yarn is at the back. The stitch to work sits at the tip of the left needle, and the right needle waits.','Put the right needle tip through the front of the stitch, from left to right, so it sits under the left needle.','Wrap the yarn around the right needle tip, counter-clockwise.','Pull the new loop back through the old stitch with the right needle tip.','Let the old stitch slide off the left needle. The new loop is now a stitch on the right needle.']},
      purl:{label:'Purl stitch',steps:['Hold the yarn in front of the work. The stitch to work sits at the tip of the left needle.','Put the right needle tip into the front of the stitch, from right to left, so it sits in front of the left needle.','Wrap the yarn around the right needle tip, counter-clockwise.','Pull the new loop back through the old stitch.','Let the old stitch slide off the left needle. The new loop is now a stitch on the right needle.']},
      slip:{label:'Slip two stitches with the yarn at the back',steps:['Two stitches wait on the left needle. The yarn stays at the back.','Put the right needle into the first stitch as if to purl, from right to left.','Slide the stitch onto the right needle without knitting it. The second stitch moves up to the tip.','Slip the second stitch the same way. Nothing was knitted, so no new loop was made.']},
      k2tog:{label:'Knit 2 together',steps:['Two stitches wait on the left needle.','Put the right needle through both stitches at once, as if to knit.','Wrap the yarn around the right needle tip.','Pull the new loop back through both stitches.','Let both old stitches slide off. Two stitches have become one, leaning to the right.']},
      ssk:{label:'Slip, slip, knit',steps:['Two stitches wait on the left needle.','Slip the first stitch to the right needle as if to knit.','Slip the second stitch the same way. The two stitches have swapped order.','Slide the left needle through the fronts of both stitches, moving them back to the left needle.','Put the right needle through both stitches at once, as if to knit.','Wrap the yarn around the right needle tip.','Pull the new loop through and let both old stitches slide off. Two stitches have become one, leaning to the left.']},
      cableB:{label:'Cable B',steps:['Three stitches wait on the left needle. The numbers show the order you work them.','Slide stitch 1 onto the cable needle and hold it in front of the work.','Knit stitches 2 and 3 from the left needle, as in the knit stitch lesson.','Knit stitch 1 from the cable needle. It has jumped over two stitches.']},
      cableA:{label:'Cable A',steps:['Three stitches wait on the left needle. The numbers show the order you work them.','Slide stitches 1 and 2 onto the cable needle and hold them behind the work.','Knit stitch 3 from the left needle.','Knit stitches 1 and 2 from the cable needle. Stitch 3 has crossed to the other side of them.']}
    },
    anim:{
      cableB:{label:'Cable B',steps:['Three stitches wait on the left needle. The numbers show the order you work them.','Slip stitch 1 onto the cable needle and hold it in front of the work.','Knit stitches 2 and 3 from the left needle.','Knit stitch 1 from the cable needle. It has jumped over two stitches.']},
      cableA:{label:'Cable A',steps:['Three stitches wait on the left needle. The numbers show the order you work them.','Slip stitches 1 and 2 onto the cable needle and hold them behind the work.','Knit stitch 3 from the left needle.','Knit stitches 1 and 2 from the cable needle. Stitch 3 has crossed to the other side of them.']},
      slip:{label:'Slip two stitches with the yarn at the back',steps:['Two stitches wait on the left needle. The yarn runs along the back.','Slip the first stitch to the right needle as if to purl. The yarn stays at the back.','Slip the second stitch the same way. Nothing was knitted, so no new loops were made.']},
      k2tog:{label:'Knit 2 together, right-leaning decrease',steps:['Two stitches wait on the left needle.','Put the right needle through both stitches at once, as if to knit.','Knit them together. Two stitches become one, leaning to the right.']},
      ssk:{label:'Slip, slip, knit, left-leaning decrease',steps:['Two stitches wait on the left needle.','Slip the first stitch to the right needle as if to knit.','Slip the second stitch the same way. The two stitches have swapped order.','Put the left needle through the fronts of both and knit them together. Two stitches become one, leaning to the left.']}
    }

    lessons:{
      caston:{title:'Набор петель и соединение в круг',steps:['Наберите 76 петель на круговые спицы № 4 и ещё 1 петлю для соединения.','Проверьте, что набранный край лежит ровно по всему кругу и не перекручен.','Замкните круг. Обычно лишнюю петлю провязывают вместе с первой, и остаётся 76. Поставьте маркер в начале ряда.']},
      knit:{title:'Лицевая петля',steps:['Введите правую спицу в переднюю стенку следующей петли слева направо.','Оберните нить вокруг правой спицы против часовой стрелки.','Протяните новую петлю сквозь старую.','Сбросьте старую петлю с левой спицы.']},
      purl:{title:'Изнаночная петля и резинка 1 на 1',steps:['Держите нить перед работой.','Введите правую спицу в переднюю стенку следующей петли справа налево.','Оберните нить против часовой стрелки, протяните петлю и сбросьте старую петлю.','Для резинки чередуйте 1 лицевую, 1 изнаночную по всему кругу, всего 15 рядов. Если хотите шапку с отворотом, свяжите 32 ряда.']},
      incr:{title:'Равномерная прибавка: 76 → 84',steps:['Перейдите на спицы № 5 и начните ряд 1 схемы.','В этом ряду равномерно прибавьте 8 петель. 76 делить на 8 — это 9,5, поэтому прибавляйте примерно через каждые 9–10 петель.','В описании прибавка не названа. Часто выбирают накид из протяжки между петлями, потому что он малозаметен.','Теперь у вас 84 петли, то есть 6 раппортов по 14 петель.']},
      chart:{title:'Как читать схему по кругу',steps:['Начните с правой нижней клетки. Номера рядов стоят справа.','Читайте каждый ряд справа налево. Так как вы вяжете по кругу, все ряды лицевые, и каждый символ означает ровно то, что сказано в условных обозначениях.','14 столбцов — это один раппорт. Повторите его 6 раз, чтобы получился целый ряд.','Свяжите ряды с 1-го по 14-й один раз, затем повторяйте ряды с 3-го по 14-й до нужной длины (2–2,5 раппорта).']},

      sCast:{title:'Набор петель и замыкание в круг',steps:['Наберите 40 петель для малой звезды.','Распределите петли на 4 чулочные спицы и замкните в круг без перекручивания. Отметьте начало круга.','Схема — один раппорт из 5 петель, который повторяют 8 раз в круге (40 ÷ 5 = 8).']},
      sChart:{title:'Как читать схему по кругу',steps:['Каждый круг вяжется справа налево, потому что вы вяжете по кругу.','Круги пронумерованы справа. Схема — треугольник, потому что звезда растёт: с каждым кругом раппорт становится шире.','Круги 2 и 4 не нарисованы. В тексте сказано провязывать все петли и накиды лицевыми в кругах без рисунка, поэтому здесь они бледные.','Начиная с круга 5 каждый круг нарисован. Свяжите все 12 кругов один раз.','Пользуйтесь проверкой числа петель: каждый круг должен брать ровно столько петель, сколько создал предыдущий.']},

      k2tog:{title:'Две петли вместе лицевой',steps:['Введите правую спицу сразу в две следующие петли, как для лицевой.','Оберните нить и протяните петлю через обе.','Сбросьте обе старые петли. Две петли превратились в одну с наклоном вправо.']},
      skp:{title:'Снять 1, провязать 1, протянуть снятую',steps:['Снимите одну петлю как для лицевой, не провязывая.','Провяжите следующую петлю.','Протяните снятую петлю через провязанную и снимите со спицы. Две петли превратились в одну с наклоном влево.']},

      sFinish:{title:'Обвязка крючком',steps:['После круга 12 группы петель, соединённые дугами вверху схемы, снимите на крючок и свяжите вместе, между группами выполняя воздушные петли. Их число указано цифрами над дугами.','В конце круга закрепите нить. У этого урока пока нет анимации, потому что здесь нужен крючок.','Приведите звезду в форму: растяните её и дайте высохнуть, как описано в журнале.']},
      cableB:{title:'Коса B: одна петля проходит спереди',steps:[]},

      oval:{title:'Собираем овал',steps:['Каждый овал шириной в шесть петель состоит из косы A и косы B рядом, они вяжутся в одном ряду. Сначала коса A, потом коса B.','Каждому ряду с перекрестием предшествует ряд со снятыми петлями. В ряду перед перекрестием две снятые петли стоят посередине овала.','Овалы сдвинуты друг относительно друга. Левый овал перекрещивается в рядах 3, 5 и 7, правый — в рядах 9, 11 и 13.','Ряд 14 — ряд со снятыми петлями для левого овала, поэтому повторение рядов с 3-го по 14-й сразу ведёт к перекрестию левого овала в ряду 3.']},
      crown:{title:'Убавления на макушке',steps:['После последнего раппорта свяжите шесть рядов убавок из таблицы. Звёздочки отмечают часть, которую повторяют по кругу.','Убавка с наклоном влево обычно делается так: снять, снять, провязать две петли вместе. Убавка с наклоном вправо — две петли вместе лицевой.','Когда останется 12 петель, оборвите нить, протяните её через все петли и крепко стяните макушку.']}

    needle:{

      knit:{label:'Лицевая петля',steps:['Нить находится за работой. Петля, которую нужно провязать, стоит на кончике левой спицы, правая спица ждёт.','Введите кончик правой спицы в переднюю стенку петли слева направо, под левую спицу.','Оберните нить вокруг кончика правой спицы против часовой стрелки.','Кончиком правой спицы протяните новую петлю назад сквозь старую.','Сбросьте старую петлю с левой спицы. Новая петля теперь лежит на правой спице.']},
      purl:{label:'Изнаночная петля',steps:['Держите нить перед работой. Петля, которую нужно провязать, стоит на кончике левой спицы.','Введите кончик правой спицы в переднюю стенку петли справа налево, перед левой спицей.','Оберните нить вокруг кончика правой спицы против часовой стрелки.','Протяните новую петлю назад сквозь старую.','Сбросьте старую петлю с левой спицы. Новая петля теперь лежит на правой спице.']},
      slip:{label:'Снять две петли с нитью за работой',steps:['Две петли ждут на левой спице. Нить остаётся за работой.','Введите правую спицу в первую петлю как для изнаночной, справа налево.','Переведите петлю на правую спицу, не провязывая её. Вторая петля подвигается к кончику.','Так же снимите вторую петлю. Ничего не провязано, новой петли не появилось.']},
      k2tog:{label:'Две петли вместе лицевой',steps:['Две петли ждут на левой спице.','Введите правую спицу сразу в обе петли, как для лицевой.','Оберните нить вокруг кончика правой спицы.','Протяните новую петлю назад сквозь обе петли.','Сбросьте обе старые петли. Две петли превратились в одну с наклоном вправо.']},
      ssk:{label:'Снять, снять, провязать',steps:['Две петли ждут на левой спице.','Снимите первую петлю на правую спицу как для лицевой.','Так же снимите вторую петлю. Две петли поменялись местами.','Проведите левую спицу через передние стенки обеих петель и переведите их назад на левую спицу.','Введите правую спицу сразу в обе петли, как для лицевой.','Оберните нить вокруг кончика правой спицы.','Протяните новую петлю и сбросьте обе старые петли. Две петли превратились в одну с наклоном влево.']},
      cableB:{label:'Коса B',steps:['Три петли ждут на левой спице. Цифры показывают порядок вязания.','Переведите петлю 1 на вспомогательную спицу и оставьте перед работой.','Провяжите петли 2 и 3 с левой спицы (как в уроке про лицевую петлю).','Провяжите петлю 1 со вспомогательной спицы. Она перепрыгнула через две петли.']},
      cableA:{label:'Коса A',steps:['Три петли ждут на левой спице. Цифры показывают порядок вязания.','Переведите петли 1 и 2 на вспомогательную спицу и оставьте за работой.','Провяжите петлю 3 с левой спицы.','Провяжите петли 1 и 2 со вспомогательной спицы. Петля 3 оказалась по другую сторону от них.']}
    },
    anim:{
      cableB:{label:'Коса B',steps:['Три петли ждут на левой спице. Цифры показывают порядок вязания.','Снимите петлю 1 на вспомогательную спицу и оставьте перед работой.','Провяжите петли 2 и 3 с левой спицы.','Провяжите петлю 1 со вспомогательной спицы. Она перепрыгнула через две петли.']},
      cableA:{label:'Коса A',steps:['Три петли ждут на левой спице. Цифры показывают порядок вязания.','Снимите петли 1 и 2 на вспомогательную спицу и оставьте за работой.','Провяжите петлю 3 с левой спицы.','Провяжите петли 1 и 2 со вспомогательной спицы. Петля 3 оказалась по другую сторону от них.']},
      slip:{label:'Снять две петли с нитью за работой',steps:['Две петли ждут на левой спице. Нить идёт за работой.','Снимите первую петлю на правую спицу как для изнаночной. Нить остаётся за работой.','Так же снимите вторую петлю. Петли не провязывались, новых нитей не появилось.']},
      k2tog:{label:'Две петли вместе лицевой, убавка с наклоном вправо',steps:['Две петли ждут на левой спице.','Введите правую спицу сразу в обе петли, как для лицевой.','Провяжите их вместе. Две петли превращаются в одну с наклоном вправо.']},
      ssk:{label:'Снять, снять, провязать: убавка с наклоном влево',steps:['Две петли ждут на левой спице.','Снимите первую петлю на правую спицу как для лицевой.','Так же снимите вторую петлю. Две петли поменялись местами.','Введите левую спицу в передние стенки обеих петель и провяжите их вместе. Две петли превращаются в одну с наклоном влево.']}
    }
  }

  /* ---------- language state ---------- */
  var lang='en';
  (function pick(){
    var codes=LANG_LIST.map(function(l){return l.code;});
    var saved=null;
    try{ saved=localStorage.getItem('cableBeanieLang'); }catch(e){}
    if(saved && codes.indexOf(saved)>=0){ lang=saved; return; }
    var nav=((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();
    if(codes.indexOf(nav)>=0) lang=nav;
  })();
  function raw(path,l){
    var parts=path.split('.'), o=STR[l||lang];
    for(var i=0;i<parts.length&&o!=null;i++) o=o[parts[i]];
    return o;
  }
  function get(path){
    var v=raw(path); if(v==null) v=raw(path,'en'); return v;
  }
  function t(path,vars){
    var s=get(path); if(typeof s!=='string') return '';
    if(vars) s=s.replace(/\{(\w+)\}/g,function(m,k){ return vars[k]!==undefined?vars[k]:m; });
    return s;
  }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  /* ---------- patterns ---------- */
  var PAT='hat';
  var PATTERNS={
    hat:{rows:14,rep:14,srcLang:'ru',lessons:['caston','knit','purl','incr','chart','slip','cableB','cableA','oval','crown']},
    star:{rows:12,rep:5,srcLang:'de',lessons:['sCast','knit','sChart','yo','k2tog','skp','inc3','sFinish']}
  };
  function rowsN(){ return PATTERNS[PAT].rows; }
  function showSrc(){ return PATTERNS[PAT].srcLang==='ru' ? lang!=='ru' : true; }

  /* ---------- cable beanie data ---------- */
  var N=14, CELL=40, X0=8, Y0=34;
  function hatCell(r,c){
    if(c===1||c===8) return {t:'p'};
    var left=c>=9;
    var cross=left?[3,5,7]:[9,11,13];
    var slip=left?[2,4,6,14]:[8,10,12];
    var base=left?9:2;
    var k=c-base;
    var block=left?'left':'right';
    if(cross.indexOf(r)>=0){
      if(k<3) return {t:'A',i:3-k,block:block};
      return {t:'B',i:6-k,block:block};
    }
    if(slip.indexOf(r)>=0 && (k===2||k===3)) return {t:'v'};
    return {t:'k'};
  }

  /* ---------- lace star data (rows are listed left to right as drawn) ---------- */
  var STAR_ROWS={
    1:'k k k k k',
    3:'k k I I I k k',
    5:'k skp yo k yo k2tog k',
    6:'k k k I I I k k k',
    7:'skp yo skp yo k yo k2tog yo k2tog',
    8:'k k k k I I I k k k k',
    9:'k skp yo skp yo k yo k2tog yo k2tog k',
    10:'k k k k k I I I k k k k k',
    11:'skp yo skp yo skp yo k yo k2tog yo k2tog yo k2tog',
    12:'k k k k k k I I I k k k k k k'
  };
  var misread=false;
  function starRow(r){
    var s=STAR_ROWS[r], a, i;
    if(s){ a=s.split(' '); if(misread&&r===7) a[2]='k'; return {cells:a,ghost:false}; }
    var prev=starRow(r-1); a=[];
    for(i=0;i<prev.cells.length;i++) a.push('k');
    return {cells:a,ghost:true};
  }
  function starCell(r,c){
    var row=starRow(r), w=row.cells.length, idx=w-c, t0=row.cells[idx];
    if(row.ghost) return {t:'k',ghost:true};
    if(t0==='I'){ var f=idx; while(f>0&&row.cells[f-1]==='I') f--; return {t:'I',i:idx-f,f:f,l:f+2}; }
    return {t:t0};
  }
  var CIN={k:1,p:1,v:1,A:1,B:1,yo:0,k2tog:2,skp:2};
  function starCounts(){
    var out=[], prev=PATTERNS.star.rep;
    for(var r=1;r<=12;r++){
      var row=starRow(r), inn=0, ni=0;
      row.cells.forEach(function(c){ if(c==='I') ni++; else inn+=CIN[c]; });
      inn+=ni/3;
      out.push({r:r,inn:inn,out:row.cells.length,expect:prev,ok:inn===prev});
      prev=row.cells.length;
    }
    return out;
  }
  function hatCounts(){
    var out=[]; for(var r=1;r<=14;r++) out.push({r:r,inn:14,out:14,expect:14,ok:true});
    return out;
  }
  function countsFor(){ return PAT==='star'?starCounts():hatCounts(); }

  function cellOf(r,c){ return PAT==='star'?starCell(r,c):hatCell(r,c); }
  function widthOf(r){ return PAT==='star'?starRow(r).cells.length:N; }
  function roundTokens(r){
    var out=[], seen={}, w=widthOf(r);
    for(var c=1;c<=w;c++){
      var cell=cellOf(r,c);
      if(cell.t==='A'||cell.t==='B'){
        var id=cell.block+cell.t;
        if(seen[id]) continue;
        seen[id]=1; out.push({t:cell.t,n:1}); continue;
      }
      if(cell.t==='I'){ if(seen.I) continue; seen.I=1; out.push({t:'inc',n:1}); continue; }
      var last=out[out.length-1];
      if(last && last.t===cell.t) last.n++; else out.push({t:cell.t,n:1});
    }
    return out;
  }
  function chipText(tok){ return t('chip'+tok.t.toUpperCase(),{n:tok.n}); }
  function plain(tok){ return t('tok'+tok.t.toUpperCase(),{n:tok.n}); }
  function chipCls(t0){ return {A:'A',B:'B',v:'v',yo:'v',k2tog:'B',skp:'A'}[t0]||''; }
  function symbolSVG(cell){
    var t0=cell.t;
    if(t0==='k') return '<path d="M20 7V33"/>';
    if(t0==='p') return '<path d="M10 20H30"/>';
    if(t0==='v') return '<path d="M12 9L20 31L28 9"/>';
    if(t0==='yo') return '<path d="M12 10V24A8 8 0 0 0 28 24V10"/>';
    if(t0==='k2tog') return '<path d="M10 11L20 32L30 11"/><text x="24" y="17" font-size="12" font-weight="700" fill="var(--fg)" stroke="none" font-family="Inter,system-ui,sans-serif">2</text>';
    if(t0==='skp') return '<path d="M20 7V32M12 24L20 32L28 24"/>';
    if(t0==='I') return cell.i===1?'<path d="M12 10V22A8 8 0 0 0 28 22V10"/>':'<path d="M20 7V33"/>';
    var d;
    if(t0==='B') d=(cell.i===1)?'M0 10H11L26 30H40':'M0 30H40';
    else d=(cell.i===3)?'M0 30H14L29 10H40':'M0 30H40';
    return '<path class="thin" d="M20 6V34"/><path d="'+d+'"/>';
  }
  function groupCols(r,c){
    var cell=cellOf(r,c);
    if(PAT==='star'){
      if(cell.t!=='I') return [c,c];
      var w=widthOf(r); return [w-cell.l,w-cell.f];
    }
    if(cell.t!=='A'&&cell.t!=='B') return [c,c];
    var base=cell.block==='left'?9:2;
    return cell.t==='A'?[base,base+2]:[base+3,base+5];
  }

  /* ---------- state ---------- */
  var sel={r:1,c:1};
  var skipped={};
  try{
    var saved=localStorage.getItem('cableBeanieSkipped');
    if(saved) skipped=JSON.parse(saved)||{};
  }catch(e){}
  function saveSkips(){
    try{ localStorage.setItem('cableBeanieSkipped',JSON.stringify(skipped)); }catch(e){}
  }

  /* ---------- chart drawing ---------- */
  var svg=document.getElementById('chart');
  function xOf(c){ return X0+(N-c)*CELL; }
  function yOf(r){ return Y0+(N-r)*CELL; }
  function drawHat(){
    svg.setAttribute('viewBox','0 0 608 626');
    var h='';
    h+='<g><path class="bracket" d="M'+(xOf(14)+3)+' 26V22H'+(xOf(9)+CELL-3)+'V26"/><text class="axis" text-anchor="middle" x="'+((xOf(14)+xOf(9)+CELL)/2)+'" y="14">'+t('ovalLeft')+'</text></g>';
    h+='<g><path class="bracket" d="M'+(xOf(7)+3)+' 26V22H'+(xOf(2)+CELL-3)+'V26"/><text class="axis" text-anchor="middle" x="'+((xOf(7)+xOf(2)+CELL)/2)+'" y="14">'+t('ovalRight')+'</text></g>';
    for(var r=N;r>=1;r--){
      for(var c=N;c>=1;c--){
        var cell=cellOf(r,c), x=xOf(c), y=yOf(r);
        h+='<g data-r="'+r+'" data-c="'+c+'"><rect class="cell t-'+cell.t+'" x="'+x+'" y="'+y+'" width="'+CELL+'" height="'+CELL+'"/>'+
           '<g class="sym" transform="translate('+x+' '+y+')">'+symbolSVG(cell)+'</g></g>';
      }
    }
    h+='<rect class="band" x="'+X0+'" y="'+yOf(sel.r)+'" width="'+(N*CELL)+'" height="'+CELL+'"/>';
    var gc=groupCols(sel.r,sel.c);
    h+='<rect class="pick" x="'+(xOf(gc[1])+1.5)+'" y="'+(yOf(sel.r)+1.5)+'" width="'+((gc[1]-gc[0]+1)*CELL-3)+'" height="'+(CELL-3)+'" rx="3"/>';
    for(var rr=N;rr>=1;rr--){
      h+='<text class="axis rowlabel'+(rr===sel.r?' on':'')+'" data-row="'+rr+'" x="'+(X0+N*CELL+10)+'" y="'+(yOf(rr)+CELL/2+5)+'">'+rr+'</text>';
    }
    for(var cc=N;cc>=1;cc--){
      h+='<text class="axis'+(cc===sel.c?' on':'')+'" text-anchor="middle" x="'+(xOf(cc)+CELL/2)+'" y="'+(Y0+N*CELL+22)+'">'+cc+'</text>';
    }
    svg.innerHTML=h;
  }
  var SC=36, SCX=292, SY0=10;
  function drawStar(){
    var R=12, h='', cs=starCounts(), i;
    svg.setAttribute('viewBox','0 0 608 '+(SY0+R*SC+10));
    var cls={k:'k',yo:'v',k2tog:'B',skp:'A',I:'p'};
    for(var r=R;r>=1;r--){
      var row=starRow(r), w=row.cells.length, x0=SCX-w*SC/2, y=SY0+(R-r)*SC;
      for(var c=w;c>=1;c--){

  function lerpN(a,b,t){ return a+(b-a)*t; }
  function lerpNeedle(a,b,t){
    var h=t<0.5, o={lt:lerpN(a.lt,b.lt,t),rt:[lerpN(a.rt[0],b.rt[0],t),lerpN(a.rt[1],b.rt[1],t)],tag:h?a.tag:b.tag,yz:h?a.yz:b.yz};

    o.rings=a.rings.map(function(ra,i){
      var rb=b.rings[i];
      return {x:lerpN(ra.x,rb.x,t),y:lerpN(ra.y,rb.y,t),rot:lerpN(ra.rot,rb.rot,t),a:lerpN(ra.a,rb.a,t),rx:lerpN(ra.rx,rb.rx,t),ry:lerpN(ra.ry,rb.ry,t),
        col:h?ra.col:rb.col,th:h?ra.th:rb.th,lab:h?ra.lab:rb.lab};
    });
    o.yarn=(a.yarn&&b.yarn)?a.yarn.map(function(pa,i){ return [lerpN(pa[0],b.yarn[i][0],t),lerpN(pa[1],b.yarn[i][1],t)]; }):(b.yarn||a.yarn);

  function ringXf(r){ return 'translate('+r.x.toFixed(1)+' '+r.y.toFixed(1)+') rotate('+r.rot.toFixed(1)+')'; }

  }
  function ringFull(r){
    return '<ellipse rx="'+r.rx.toFixed(1)+'" ry="'+r.ry.toFixed(1)+'" transform="'+ringXf(r)+'" fill="none" stroke="'+r.col+'" stroke-width="4.5" opacity="'+r.a.toFixed(3)+'"/>';

  function yarnPath(pts){
    var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1), i, m;
    for(i=1;i<pts.length-1;i++){
      m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];
      d+=' Q'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' '+m[0].toFixed(1)+' '+m[1].toFixed(1);
    }
    var l=pts[pts.length-1];
    return '<path d="'+d+' L'+l[0].toFixed(1)+' '+l[1].toFixed(1)+'" fill="none" stroke="var(--yarn)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';

  function renderNeedle(st){

  var mounted=[];

  function mountAnim(el){
    var id=el.getAttribute('data-anim'), kind=el.getAttribute('data-kind')||'diagram', K=KIND[kind], def=K.defs[id]; if(!def) return;
    var caps=get(K.key+'.'+id+'.steps');
    var stage=el.querySelector('svg'), capEl=el.querySelector('.cap'), dots=el.querySelector('.dots'), playBtn=el.querySelector('[data-act="play"]');
    var n=def.steps.length, idx=0, cur=def.steps[0], playing=false, userStopped=false, raf=0, tmr=0, obs=null;
    var dh=''; for(var i=0;i<n;i++) dh+='<button type="button" data-i="'+i+'" aria-label="'+t('goStep',{n:i+1})+'">'+(i+1)+'</button>';
    dots.innerHTML=dh;
    function draw(){ stage.innerHTML=K.render(cur,def); }
    function label(){
      capEl.textContent=(idx+1)+'. '+caps[idx];
      var bs=dots.querySelectorAll('button');
      for(var j=0;j<bs.length;j++){ if(j===idx) bs[j].setAttribute('aria-current','step'); else bs[j].removeAttribute('aria-current'); }
    }
    function cancel(){ cancelAnimationFrame(raf); clearTimeout(tmr); }
    function go(i,animate,done){
      cancel(); idx=i; label();
      var target=def.steps[i];
      if(!animate||REDUCED){ cur=target; draw(); if(done) done(); return; }
      var from=cur, t0=null;
      function frame(ts){
        if(t0===null) t0=ts;
        var p=Math.min(1,(ts-t0)/1100);
        cur=K.lerp(from,target,ease(p)); draw();
        if(p<1) raf=requestAnimationFrame(frame); else { cur=target; if(done) done(); }
      }
      raf=requestAnimationFrame(frame);
    }
    function loop(){
      if(!playing) return;
      tmr=setTimeout(function(){
        if(!playing) return;
        var nx=(idx+1)%n;
        go(nx,nx!==0,loop);
      },1600);
    }
    function play(){ playing=true; playBtn.textContent=t('pause'); loop(); }
    function pause(){ playing=false; clearTimeout(tmr); playBtn.textContent=t('play'); }
    function manual(){ userStopped=true; pause(); }
    playBtn.onclick=function(){ if(playing){ manual(); } else { userStopped=false; play(); } };
    el.querySelector('[data-act="prev"]').onclick=function(){ manual(); go(Math.max(0,idx-1),true); };
    el.querySelector('[data-act="next"]').onclick=function(){ manual(); var nx=(idx+1)%n; go(nx,nx!==0); };
    dots.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; manual(); go(+b.getAttribute('data-i'),true); };
    draw(); label(); playBtn.textContent=t('play');
    if(!REDUCED && 'IntersectionObserver' in window){
      obs=new IntersectionObserver(function(es){
        var vis=es[0].isIntersecting;
        if(vis && !userStopped && !playing) play();
        else if(!vis && playing) pause();
      },{threshold:0.4});
      obs.observe(el);
    }
    mounted.push(function(){ cancel(); playing=false; if(obs) obs.disconnect(); });
  }

    document.getElementById('lessons').innerHTML=LESSONS.map(lessonHTML).join('');
    mountAll();
    var n=0; LESSONS.forEach(function(l){ if(skipped[l.id]) n++; });
    document.getElementById('progress').textContent=t('progress',{n:n,total:LESSONS.length});
  }
  document.getElementById('lessons').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.getAttribute('data-skip')){ skipped[b.getAttribute('data-skip')]=true; saveSkips(); renderLessons(); }
    else if(b.getAttribute('data-show')){ delete skipped[b.getAttribute('data-show')]; saveSkips(); renderLessons(); }
    else if(b.getAttribute('data-view')){ animView=b.getAttribute('data-view'); applyView(); }
  });
  document.getElementById('skipBasics').onclick=function(){
    LESSONS.forEach(function(l){ if(l.level==='lvBasic') skipped[l.id]=true; });
    saveSkips(); renderLessons();
  };
  document.getElementById('resetSkips').onclick=function(){ skipped={}; saveSkips(); renderLessons(); };
  function openLesson(id){
    if(skipped[id]){ delete skipped[id]; saveSkips(); renderLessons(); }
    var el=document.getElementById('lesson-'+id);
    if(!el) return;
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.classList.add('flash');
    setTimeout(function(){ el.classList.remove('flash'); },1600);
    var hd=document.getElementById('lt-'+id); if(hd) hd.focus({preventScroll:true});
  }

  /* ---------- language switcher + static text ---------- */
  var HDR={
    hat:{h1:'h1',intro:'intro',facts:[['yarnL','yarnV'],['needlesL','needlesV'],['headL','headV'],['stitchesL','stitchesV']],note:'note',hint:'chartHint'},
    star:{h1:'starH1',intro:'starIntro',facts:[['sYarnL','sYarnV'],['sNeedlesL','sNeedlesV'],['sSizeL','sSizeV'],['sRoundsL','sRoundsV']],note:'starNote',hint:'starChartHint'}
  };
  function applyStatic(){
    var els=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<els.length;i++) els[i].textContent=t(els[i].getAttribute('data-i18n'));
    document.documentElement.lang=lang;
    var H=HDR[PAT];
    document.getElementById('h1T').textContent=t(H.h1);
    document.getElementById('introP').textContent=t(H.intro);
    document.getElementById('noteP').textContent=t(H.note);
    document.getElementById('chartHintP').textContent=t(H.hint);
    document.getElementById('facts').innerHTML=H.facts.map(function(f){ return '<span><b>'+t(f[0])+'</b> '+t(f[1])+'</span>'; }).join('');
    var bar=document.getElementById('langBar');
    bar.setAttribute('aria-label',t('langLabel'));
    bar.innerHTML=LANG_LIST.map(function(l){
      return '<button type="button" data-lang="'+l.code+'" lang="'+l.code+'" title="'+l.name+'" aria-pressed="'+(l.code===lang)+'">'+l.label+'</button>';
    }).join('');
    var pb=document.getElementById('patBar');
    pb.setAttribute('aria-label',t('patLabel'));
    pb.innerHTML=['hat','star'].map(function(p){
      return '<button type="button" data-pat="'+p+'" aria-pressed="'+(p===PAT)+'">'+t(p==='hat'?'patHat':'patStar')+'</button>';
    }).join('');
  }
  document.getElementById('patBar').addEventListener('click',function(e){
    var b=e.target.closest('button[data-pat]'); if(!b||b.getAttribute('data-pat')===PAT) return;
    PAT=b.getAttribute('data-pat'); sel={r:1,c:1}; misread=false;
    renderAll();
  });
  document.getElementById('langBar').addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]'); if(!b) return;
    lang=b.getAttribute('data-lang');
    try{ localStorage.setItem('cableBeanieLang',lang); }catch(err){}
    renderAll();
  });

  function render(){ drawChart(); renderRound(); renderStitch(); }
  function renderAll(){ refreshLessons(); applyStatic(); renderLegend(); render(); renderCheck(); renderLessons(); }
  renderAll();
})();
</script>

</body>
</html>
